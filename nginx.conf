server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-Frame-Options          "DENY"                             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "geolocation=()"                   always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # script-src: no 'unsafe-inline' — all page JS is now in external /js/*.js files.
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://data.riksdagen.se https://www.riksdagen.se; connect-src 'self'; frame-ancestors 'none';" always;

    root /usr/share/nginx/html;
    index index.html;

    # HTML must always be revalidated (Cache-Control: no-cache) so nav/card
    # changes show up immediately; unchanged files still return 304 via ETag.
    expires -1;

    # Proxy all API and health calls to the Go backend container.
    # proxy_pass without a trailing slash preserves the full /api/v1/... path.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /sitemap.xml {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /robots.txt {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    # Category pages — exact-match routes, no trailing slash needed
    location ~ ^/lan/[a-z][a-z]?$ { try_files /lan.html =404; }

    location = /trafik        { try_files /trafik.html =404; }
    location = /ekonomi       { try_files /ekonomi.html =404; }
    location = /val           { try_files /val.html =404; }
    location = /luftkvalitet  { try_files /luftkvalitet.html =404; }
    location = /brott         { try_files /brott.html =404; }
    location = /halsa          { try_files /halsa.html =404; }
    location = /sjukskrivning  { try_files /sjukskrivning.html =404; }
    location = /brp             { try_files /brp.html =404; }
    location = /vindkraft       { return 301 /energi; }
    location = /energi          { try_files /energi.html =404; }
    location = /domstol     { try_files /domstol.html =404; }
    location = /befolkning  { try_files /befolkning.html =404; }
    location = /riksdagen   { try_files /riksdagen.html =404; }
    location = /inkomst    { try_files /inkomst.html =404; }
    location = /polis      { try_files /polis.html =404; }
    location = /vader         { try_files /vader.html =404; }
    location = /arbetsmarknad { try_files /arbetsmarknad.html =404; }
    location = /utbildning    { try_files /utbildning.html =404; }
    location = /om            { try_files /om.html =404; }
    location = /skatt         { try_files /skatt.html =404; }
    location = /samband       { try_files /samband.html =404; }

    # JS/CSS change with the pages — cache briefly so fixes reach users within a day.
    location ~* \.(?:js|css)$ {
        expires 1d;
        try_files $uri =404;
    }

    # Fonts and images are effectively immutable.
    location ~* \.(?:woff2|svg|png|ico|webp)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
